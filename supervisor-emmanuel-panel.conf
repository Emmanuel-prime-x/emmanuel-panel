; ============================================================
;  EMMANUEL PANEL - services supervisord
;  A copier dans /etc/supervisor/conf.d/emmanuel-panel.conf
;  (le hook de demarrage /workspace/.agent_hooks/startup/00_ensure_panel.py
;   le fait automatiquement au boot du sandbox)
;
;  Deux services :
;    - emmanuel-panel   : le panel (node server.js) + tunnel Cloudflare
;    - panel-watchdog   : auto-reparation (anti-doublon + relance si arrete)
; ============================================================

[program:emmanuel-panel]
command=/bin/bash -lc "exec /workspace/panel/start.sh"
directory=/workspace/panel
user=root
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=15
environment=NODE_ENV="production",PANEL_PORT="3000",PANEL_TUNNEL="1"
stdout_logfile=/workspace/panel/data/panel.out.log
stderr_logfile=/workspace/panel/data/panel.err.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:panel-watchdog]
command=/bin/bash /workspace/panel/watchdog.sh
directory=/workspace/panel
user=root
autostart=true
autorestart=true
startsecs=3
startretries=1000
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/workspace/panel/data/watchdog.out.log
stderr_logfile=/workspace/panel/data/watchdog.err.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=1
stderr_logfile_maxbytes=2MB
stderr_logfile_backups=1
